<!DOCTYPE html>
<html lang='en'>
  <head>
    <!--[if lt IE 9]>
        <script src="//html5shim.googlecode.com/svn/trunk/html5.js"></script>
        <![endif]
	 -->
	 <title>Emacs Theme Editor</title>
	 <meta content='text/html; charset=UTF-8' http-equiv='content-type'>
	 <meta charset='utf-8'>
	 <meta content='width=device-width, initial-scale=1, maximum-scale=1' name='viewport'>
	 <link href='//fonts.googleapis.com/css?family=Oswald' rel='stylesheet' type='text/css'>
	 <link href='./css/bootstrap.min.css' rel='stylesheet'>
	 <link href='./css/github.css' rel='stylesheet'>
	 <link href='./css/spectrum.css' rel='stylesheet'>
	 <link href='./css/themes.css' rel='stylesheet'>
  </head>
  <body>
    <!-- Header -->
    <div class='navbar navbar-inverse navbar-static-top' id='top-nav'>
      <div class='container-fluid'>
        <div class='navbar-header'>
          <button class='navbar-toggle' data-target='.navbar-collapse' data-toggle='collapse' type='button'>
            <span class='icon-bar'></span>
            <span class='icon-bar'></span>
            <span class='icon-bar'></span>
          </button>
          <a class='navbar-brand' href='#'>Emacs Theme Editor</a>
        </div>
      </div>
      <!-- /container -->
    </div>
    <!-- /Header -->
    <!-- Main -->
    <div class='container-fluid'>
      <div class='row'>
        <div class='col-sm-3'>
          <div class='panel panel-default'>
            <!-- Left column -->
            <div class='panel-heading'>
              <div class='form-group'>
                <label for='theme-name'>Theme name</label>
                <input class='form-control' id='theme-name' placeholder='Theme name' type='text'>
              </div>
            </div>
            <div class='panel-body color-controls-panel'>
              <ul class='list-unstyled collapse in' id='face-list'></ul>
              <ul class='list-unstyled collapse in'>
                <li>
                  <div class='side-label'>
                    <div aria-label='actions' class='btn-group' id='action-bar' role='group'>
                      <button class='btn btn-lg btn-default' data-toggle='tooltip' id='local-storage' onclick='saveToLocalStorage()' title='Save to local storage'>
                        <span class='glyphicon glyphicon-plus'></span>
                      </button>
                      <button class='btn btn-lg btn-default' data-toggle='tooltip' id='generate' title='Generate EmacsLisp for download or copy'>
			<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"><!-- Icon from Material Symbols by Google - https://github.com/google/material-design-icons/blob/master/LICENSE --><path fill="currentColor" d="M14 24v-2h8v2zm4-3l-4-4l1.4-1.4l1.6 1.6v-4.175h2V17.2l1.6-1.6L22 17zM6 20q-.825 0-1.412-.587T4 18V4q0-.825.588-1.412T6 2h7l6 6v3.025h-7V20zm6-11h5l-5-5z"/></svg>
                      </button>
                    </div>
                  </div>
                </li>
                <li>
                  <div class='side-label'>
                    <div id='user-themes'></div>
                  </div>
                </li>                            
              </ul>
            </div>
          </div>
        </div>
        <!-- /Left column -->
        <div class='col-sm-9'>
          <!-- right panel -->
          <div class='row'>
            <div class='panel panel-default'>
              <div class='panel-heading'>
                <div id='theme-selector'></div>
              </div>
              <div class='panel-body code-panel'>
                <div class='fringe default' id='code-sample'></div>
              </div>
            </div>
          </div>
          <!-- /right panel -->
        </div>
      </div>
      <div class='row' id='theme-generated'></div>
    </div>
    <!-- /Main -->
    <footer class='text-center'>
      <small>Emacs theme editor Licenced under GNU/GPL3 - (c) Jason Milkins/ocodo - 2015-2026 .</small>
      
      <div>Show your support buy me a coffee</div>
      
      <div><a href='https://ko-fi.com/F1F714HTLD' target='_blank'><img height='36' style='border:0px;height:36px;' src='https://storage.ko-fi.com/cdn/kofi2.png?v=3' border='0' alt='Buy Me a Coffee at ko-fi.com' /></a></div>
    </footer>
    <!-- script references
         <script src='//ajax.googleapis.com/ajax/libs/jquery/2.0.2/jquery.js'></script>
	 -->
	 <script src='./js/lib/jquery.js'></script>
	 <script src='./js/lib/bootstrap.min.js'></script>
	 <script src='./js/lib/lodash.min.js'></script>
	 <script src='./js/lib/handlebars.min.js'></script>
	 <script src='./js/lib/highlight.min.js'></script>
	 <script src='./js/lib/smooth-scroll.min.js'></script>
	 <script src='./js/lib/spectrum.js'></script>
	 <script src='./js/themes.js'></script>
  </body>

</html>
